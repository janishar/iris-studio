[project]
name = "iris-studio-pup"
version = "0.1.0"
description = "The FLUX.3 prompt upsampler, run as a subprocess: optional, and never on the path that makes pixels"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "d8c1b13c756df0059bcdb6e477a1eafcd502098d" }
